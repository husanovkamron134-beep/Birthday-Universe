<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>Tug‘ilgan kun koinoti</title>
<style>
:root{--ink:#f5f4ff;--muted:#a8acc7;--gold:#f5d49a;--cyan:#8ee8ff;--bg:#03040c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;touch-action:none}
canvas{display:block}

/* ——— umumiy qatlamlar ——— */
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 40%,rgba(2,3,10,.35) 75%,rgba(1,2,7,.85) 100%);z-index:2}
.grain{position:fixed;inset:-50%;z-index:3;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
@media(hover:hover) and (pointer:fine){.grain{animation:grain .35s steps(2) infinite}}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}

#brand{position:fixed;top:max(20px,env(safe-area-inset-top));left:0;right:0;z-index:5;text-align:center;pointer-events:none;transition:opacity .7s}
#brand small{display:block;font-size:10px;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);opacity:.9;text-shadow:0 0 20px #e6c68b66}
#brand strong{display:block;margin-top:9px;font:400 clamp(22px,4.6vw,40px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.02em;text-shadow:0 4px 30px #000}
#hint{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));z-index:5;text-align:center;pointer-events:none;font-size:10px;line-height:2;letter-spacing:.2em;text-transform:uppercase;color:#a5abc7;transition:opacity .7s;text-shadow:0 2px 14px #000}
#hint span{display:block}#hint b{color:#f0d39e;font-weight:500}
body.overlay #brand,body.overlay #hint,body.busy #hint{opacity:0}

/* ——— suratni "sayyora ichidan" ochish ——— */
#photo-viewer{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;visibility:hidden;pointer-events:none;
 background:radial-gradient(ellipse at center,rgba(9,12,38,.62) 0%,rgba(2,3,12,.94) 85%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 clip-path:circle(0px at var(--cx,50%) var(--cy,50%));
 transition:clip-path 1.05s cubic-bezier(.3,.7,.1,1),visibility 0s 1.05s}
#photo-viewer.open{visibility:visible;pointer-events:auto;clip-path:circle(150% at var(--cx,50%) var(--cy,50%));transition:clip-path 1.25s cubic-bezier(.2,.75,.15,1),visibility 0s}
.pv-rays{position:absolute;left:50%;top:50%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;pointer-events:none;opacity:0;transition:opacity 1.6s .3s;
 background:conic-gradient(from 0deg,transparent 0 6%,rgba(245,212,154,.10) 8%,transparent 11% 20%,rgba(142,232,255,.08) 23%,transparent 27% 40%,rgba(245,212,154,.09) 43%,transparent 47% 62%,rgba(180,150,255,.08) 65%,transparent 69% 84%,rgba(245,212,154,.10) 87%,transparent 91%);
 -webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);animation:spin 46s linear infinite}
.open .pv-rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.pv-frame{position:relative;margin:0;display:grid;gap:14px;justify-items:center;
 transform:translate(var(--dx,0px),var(--dy,0px)) scale(.04);opacity:0;filter:blur(14px);
 transition:transform .9s cubic-bezier(.3,.7,.1,1),opacity .5s,filter .6s}
.open .pv-frame{transform:none;opacity:1;filter:none;transition:transform 1.25s cubic-bezier(.2,.85,.15,1) .15s,opacity .8s .15s,filter 1s .15s}
#photo-large{display:block;max-width:min(88vw,980px);max-height:76vh;width:auto;height:auto;object-fit:contain;border-radius:14px;
 border:1px solid rgba(245,212,154,.55);background:#0a0e24;
 box-shadow:0 0 0 7px rgba(245,212,154,.05),0 30px 120px #000c,0 0 110px rgba(142,232,255,.16),0 0 60px rgba(245,212,154,.14)}
#photo-cap{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 18px #e6c68b66}
#photo-close{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));width:46px;height:46px;border:1px solid #ffffff55;border-radius:50%;background:#11182dcc;color:#fff;font-size:30px;line-height:1;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ——— yakuniy tabrik sahnasi ——— */
#reveal{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:28px;text-align:center;overflow:auto;
 background:radial-gradient(ellipse at center,rgba(6,8,26,.55) 0%,rgba(3,4,14,.92) 82%);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
 opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 0s 1.2s}
#reveal.show{opacity:1;visibility:visible;transition:opacity 1.3s,visibility 0s}
#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.reveal-card{position:relative;z-index:1;max-width:720px;margin:auto}
.reveal-kicker{font-size:10px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;margin-bottom:26px;opacity:0}
.show .reveal-kicker{animation:fade 1.4s ease .3s both}
.reveal-title{font:400 clamp(40px,9vw,92px)/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.035em;margin:0 0 28px}
.reveal-title .ln{display:block}
.reveal-title .w{display:inline-block;white-space:nowrap}
.reveal-title .l{display:inline-block;opacity:0}
.show .reveal-title .l{animation:rise 1.15s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.8s + var(--i) * 48ms)}
.reveal-title em{font-style:italic;color:var(--gold);text-shadow:0 0 44px rgba(245,212,154,.6)}
.reveal-message{color:#d0d3e6;font-size:clamp(14px,2vw,17px);line-height:1.95;margin:0}
.ml{display:block;opacity:0}
.show .ml{animation:fade 1.5s ease both;animation-delay:calc(2.4s + var(--k) * .55s)}
.reveal-sign{margin-top:34px;color:#f0d39e;font:italic 22px Georgia,serif;opacity:0}
.show .reveal-sign{animation:fade 1.5s ease 3.8s both}
.btn{border:1px solid #ffffff35;background:#080d20a8;color:#f4f2ed;padding:14px 22px;border-radius:2px;letter-spacing:.16em;text-transform:uppercase;font-size:10px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.3s}
.btn:hover{border-color:#f2d5a0;background:#f2d5a015;transform:translateY(-2px)}
.close{margin-top:38px;opacity:0}
.show .close{animation:fade 1.2s ease 4.4s both}
@keyframes rise{from{opacity:0;transform:translateY(.55em) scale(.9);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ——— yuklanish ——— */
#loader{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#03040c;transition:opacity 1s,visibility 1s}
#loader.done{opacity:0;visibility:hidden}
.loader-inner{text-align:center}
.loader-mark{width:46px;height:46px;border:1px solid #ffffff24;border-top-color:#f1d19a;border-radius:50%;margin:0 auto 20px;animation:spin 1.4s linear infinite}
.loader-text{font-size:9px;letter-spacing:.35em;color:#bfc4df;text-transform:uppercase}
@media(max-width:600px){#brand small{font-size:8px}#hint{font-size:8.5px}}
@media(prefers-reduced-motion:reduce){.grain{animation:none}.pv-rays{animation:none}}
</style>
</head>

<div id="stage"></div>
<script>
// Agar Three.js yuklanmasa (internet yo‘q bo‘lsa), foydalanuvchiga xabar ko‘rsatamiz.
window.setTimeout(function(){
 var loader=document.getElementById('loader');
 if(loader && !loader.classList.contains('done')){
  loader.classList.add('done');
  document.getElementById('stage').innerHTML='<div style="height:100%;display:grid;place-items:center;padding:28px;text-align:center;color:#f5d49a;font:14px system-ui">Koinot yuklanmadi. Internet aloqasini tekshirib, sahifani yangilang.</div>';
 }
},20000);
</script>

<div id="brand"><small>✦ Birthday Universe ✦</small><strong id="brand-name"></strong></div>
<div id="hint"><span>Sayyoralarni bosing — har birida bitta xotira</span><span><b>Markaziy sayyora</b> — maxsus tabrik</span></div>
<div class="vignette"></div><div class="grain"></div>
<div id="loader"><div class="loader-inner"><div class="loader-mark"></div><div class="loader-text">Koinot tayyorlanmoqda</div></div></div>

<div id="photo-viewer" role="dialog" aria-modal="true" aria-label="Xotira surati">
 <div class="pv-rays"></div>
 <figure class="pv-frame">
  <img id="photo-large" alt="Xotira surati" decoding="async">
  <figcaption id="photo-cap"></figcaption>
 </figure>
 <button id="photo-close" aria-label="Yopish">×</button>
</div>

<div id="reveal" role="dialog" aria-modal="true" aria-label="Tug‘ilgan kun tabrigi">
 <canvas id="sparks"></canvas>
 <div class="reveal-card">
  <div class="reveal-kicker">✦ &nbsp; SENGA ATALGAN KICHIK KOINOT &nbsp; ✦</div>
  <h2 class="reveal-title" id="reveal-title"></h2>
  <p class="reveal-message" id="message"></p>
  <div class="reveal-sign" id="signature"></div>
  <button class="btn close" id="close">Koinotga qaytish</button>
 </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Shaxsiylashtirish: shu yerdagi matnlarni o‘zgartiring.
const CONFIG = {
  recipient: 'Maxliyo',
  sender: 'Do‘stingdan samimiy tilaklar bilan',
  message: 'Maxliyo, yangi yoshing quvonchli lahzalar, katta orzular va unutilmas xotiralarga boy bo‘lsin.\nHar bir kuning bugungidek yorqin, qalbing esa doimo xotirjam bo‘lsin. O‘z nuring bilan porlashda davom et!'
};

const $ = s => document.querySelector(s);
const V3 = THREE.Vector3;

try { main(); } catch (err) {
  console.error(err);
  $('#loader').classList.add('done');
  $('#stage').innerHTML = '<div style="height:100%;display:grid;place-items:center;padding:28px;text-align:center;color:#f5d49a;font:14px system-ui">Bu qurilmada 3D koinotni ishga tushirib bo‘lmadi (WebGL kerak). Boshqa brauzer yoki telefonda urinib ko‘ring.</div>';
}

function main() {
/* ════════════════════ SOZLAMALAR VA SIFAT DARAJASI ════════════════════ */
const isMobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 640;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = {
  dpr: Math.min(window.devicePixelRatio || 1, isMobile ? 1.6 : 2),
  bloom: true,
  oct: isMobile ? 4 : 5,
  stars: isMobile ? 2600 : 6500,
  nearStars: isMobile ? 650 : 1500,
  orbitDust: isMobile ? 80 : 170,
  belt: isMobile ? 380 : 900,
  burst: isMobile ? 320 : 560,
  seg: isMobile ? 56 : 96
};

/* ════════════════════ MATN ════════════════════ */
$('#brand-name').textContent = CONFIG.recipient + ' uchun koinot';
$('#signature').textContent = CONFIG.sender;
(function buildTexts() {
  const title = $('#reveal-title'); let i = 0;
  const line = (text, em) => {
    const wrap = document.createElement(em ? 'em' : 'span'); wrap.className = 'ln';
    const words = text.split(' ');
    words.forEach((w, wi) => {
      const ws = document.createElement('span'); ws.className = 'w';
      [...w].forEach(ch => { const l = document.createElement('span'); l.className = 'l'; l.style.setProperty('--i', i++); l.textContent = ch; ws.appendChild(l); });
      wrap.appendChild(ws);
      if (wi < words.length - 1) wrap.appendChild(document.createTextNode(' '));
    });
    title.appendChild(wrap);
  };
  line(CONFIG.recipient + ', tug‘ilgan kuning', false);
  line('muborak!', true);
  const msg = $('#message');
  CONFIG.message.replace(/\\n/g, '\n').split('\n').forEach((t, k) => {
    const s = document.createElement('span'); s.className = 'ml'; s.style.setProperty('--k', k); s.textContent = t; msg.appendChild(s);
  });
})();

/* ════════════════════ RENDERER, SAHNA, KAMERA ════════════════════ */
const host = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Q.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x03040c, 1);
host.appendChild(renderer.domElement);
const dom = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 2000);

const U_TIME = { value: 0 }, U_PR = { value: Q.dpr };
const SUN = new V3(-0.62, 0.26, 0.74).normalize();
const ORIGIN = new V3();
const Y_AXIS = new V3(0, 1, 0);

/* ════════════════════ GLSL BO‘LAKLARI ════════════════════ */
const NOISE = `
float hash(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1.,0.,0.)),f.x),mix(hash(i+vec3(0.,1.,0.)),hash(i+vec3(1.,1.,0.)),f.x),f.y),
            mix(mix(hash(i+vec3(0.,0.,1.)),hash(i+vec3(1.,0.,1.)),f.x),mix(hash(i+vec3(0.,1.,1.)),hash(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<OCT;i++){s+=a*vnoise(p);p=p*2.02+vec3(1.7,9.2,3.1);a*=.5;}return s;}
`;

// Sayyora va atmosfera qobig‘i uchun umumiy vertex shader
const VS_BODY = `
varying vec3 vObj; varying vec3 vN; varying vec3 vW; varying vec3 vC;
void main(){
 vObj=position; vN=normalize(mat3(modelMatrix)*normal);
 vC=(modelMatrix*vec4(0.,0.,0.,1.)).xyz;
 vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz;
 gl_Position=projectionMatrix*viewMatrix*w;
}`;

const PLANET_FS = NOISE + `
uniform vec3 uC0,uC1,uC2,uC3,uAtmo,uSunDir,uCloudCol,uSpotCol;
uniform float uBandMix,uBandFreq,uScale,uSeed,uContrast,uCloud,uVein,uSpot,uGlow,uFill,uTime;
varying vec3 vObj; varying vec3 vN; varying vec3 vW;
void main(){
 vec3 p=normalize(vObj);
 vec3 q=p*uScale+vec3(uSeed,uSeed*.73,uSeed*1.31);
 float warp=fbm(q*1.4+vec3(0.,uTime*.012,0.));
 float n=fbm(q+warp*.9);
 float lat=p.y+(warp-.5)*.30;
 float b1=sin(lat*uBandFreq+n*2.6)*.5+.5, b2=sin(lat*uBandFreq*2.9+n*5.0+1.3)*.5+.5;
 float bands=.2+.68*(.74*b1+.26*b2);
 float t=mix(n*1.15,bands,uBandMix);
 t+=(fbm(q*3.1)-.5)*.22;
 float sd=distance(p,normalize(vec3(.62,-.28,.73)));
 float spot=smoothstep(.34,.05,sd)*uSpot;
 t=mix(t,.97,spot*.75);
 t=clamp((t-.5)*uContrast+.5,0.,1.);
 vec3 col=mix(uC0,uC1,smoothstep(.0,.4,t));
 col=mix(col,uC2,smoothstep(.34,.7,t));
 col=mix(col,uC3,smoothstep(.64,.97,t));
 col=mix(col,uSpotCol,spot*.6);
 col*=.82+.36*fbm(q*7.5);
 float cl=smoothstep(.5,.74,fbm(q*2.3+warp*1.6+vec3(uTime*.02,0.,0.)));
 col=mix(col,uCloudCol,cl*uCloud);
 float ridge=1.-abs(fbm(q*2.2)*2.-1.);
 float vein=smoothstep(.95,.99,ridge)*uVein;

 vec3 N=normalize(vN),V=normalize(cameraPosition-vW),L=normalize(uSunDir);
 float ndl=dot(N,L);
 float diff=max(ndl,0.);
 float wrap=smoothstep(-.2,.4,ndl);
 vec3 lit=col*(.05+1.25*mix(diff,wrap,.3));
 float term=smoothstep(-.02,.2,ndl)*(1.-smoothstep(.2,.5,ndl));
 lit+=col*vec3(1.,.5,.25)*term*.35;
 lit+=col*vec3(.05,.07,.16)*(1.-wrap)*.9;
 float ndv=max(dot(N,V),0.);
 float fres=pow(1.-ndv,3.);
 lit+=uAtmo*fres*(.12+.9*wrap)*1.15;
 lit+=col*uFill*(.25+.75*ndv)*.9;
 lit+=vec3(1.,.42,.12)*vein*(1.-.5*wrap)*1.7;
 lit+=uAtmo*uGlow*(.25+fres*1.4);
 gl_FragColor=vec4(lit,1.);
 #include <colorspace_fragment>
}`;

const SHELL_FS = `
uniform vec3 uColor,uSunDir; uniform float uDmax,uPow,uIntensity;
varying vec3 vObj; varying vec3 vN; varying vec3 vW; varying vec3 vC;
void main(){
 vec3 N=normalize(vN),V=normalize(cameraPosition-vW);
 float d=abs(dot(N,V));
 float a=pow(clamp(d/uDmax,0.,1.),uPow);
 float sun=.3+.7*smoothstep(-.35,.6,dot(normalize(vW-vC),normalize(uSunDir)));
 gl_FragColor=vec4(uColor*a*sun*uIntensity,a*sun*uIntensity);
 #include <colorspace_fragment>
}`;

const RING_VS = `
varying vec3 vLocal; varying vec3 vW;
void main(){ vLocal=position; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
const RING_FS = NOISE + `
uniform float uInner,uOuter,uSeed,uAlpha,uPlanetR,uFreq;
uniform vec3 uColA,uColB,uSunDir,uCenter;
varying vec3 vLocal; varying vec3 vW;
void main(){
 float r=length(vLocal.xy);
 float t=(r-uInner)/(uOuter-uInner);
 float d=.5*vnoise(vec3(t*14.*uFreq,uSeed,0.))+.3*vnoise(vec3(t*47.*uFreq,uSeed+3.,1.))+.2*vnoise(vec3(t*130.*uFreq,uSeed+7.,2.));
 d=smoothstep(.2,.82,d);
 d*=smoothstep(.0,.022,abs(t-.64));
 d*=mix(.3,1.,smoothstep(.0,.012,abs(t-.31)));
 float edge=smoothstep(.0,.05,t)*smoothstep(1.,.9,t);
 vec3 L=normalize(uSunDir); vec3 oc=vW-uCenter; float b=dot(oc,L);
 float dmin=sqrt(max(dot(oc,oc)-b*b,0.));
 float sh=b<0.?smoothstep(uPlanetR*.97,uPlanetR*1.05,dmin):1.;
 vec3 col=mix(uColA,uColB,vnoise(vec3(t*30.*uFreq,uSeed,5.)));
 col*=.1+1.0*sh;
 gl_FragColor=vec4(col,d*edge*uAlpha);
 #include <colorspace_fragment>
}`;

const ORBIT_VS = `varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const ORBIT_FS = `
uniform float uR,uTheta,uDir,uBase,uTrail,uCore; uniform vec3 uColor,uColorT;
varying vec2 vP;
void main(){
 float dr=abs(length(vP)-uR);
 float prof=exp(-dr*dr/(uCore*uCore*.36))+.07*exp(-dr*dr/(uCore*uCore*14.));
 float ang=atan(vP.y,vP.x);
 float d=mod((uTheta-ang)*uDir,6.2831853);
 float trail=exp(-d*uTrail);
 float head=exp(-pow(min(d,6.2831853-d)*5.,2.));
 vec3 col=mix(uColor,uColorT,clamp(trail*1.2+head,0.,1.));
 float a=prof*(uBase+.62*trail+.25*head);
 gl_FragColor=vec4(col,a);
 #include <colorspace_fragment>
}`;

const PT_VS = `
attribute float aScale; attribute float aPhase; attribute vec3 aColor;
uniform float uSize,uPR,uTime,uAtten;
varying vec3 vC; varying float vT;
void main(){
 vec4 mv=modelViewMatrix*vec4(position,1.);
 vT=.62+.38*sin(uTime*(.6+aPhase*1.8)+aPhase*40.);
 vC=aColor;
 float s=aScale*uSize*uPR;
 s*=mix(1.,32./max(-mv.z,1.),uAtten);
 gl_PointSize=clamp(s,1.,72.);
 gl_Position=projectionMatrix*mv;
}`;
const PT_FS = `
uniform float uOpacity; varying vec3 vC; varying float vT;
void main(){
 float d=length(gl_PointCoord-.5);
 float a=smoothstep(.5,.0,d); a=a*a*vT*uOpacity;
 gl_FragColor=vec4(vC*1.5,a);
 #include <colorspace_fragment>
}`;

const BURST_VS = `
attribute vec3 aVel; attribute float aSeed;
uniform float uT,uLife,uSize,uPR,uK,uSpeed; uniform vec3 uOrigin;
varying float vA; varying float vS;
void main(){
 vec3 p=uOrigin+aVel*uSpeed*((1.-exp(-uK*uT))/uK);
 float life=uLife*(.55+.45*aSeed);
 float f=clamp(uT/life,0.,1.);
 vA=(1.-f)*(1.-f)*step(uT,life); vS=aSeed;

const cam = { active: false, t: 0, dur: 2, fromPos: new V3(), fromTar: new V3(), getPos: null, getTar: null, onDone: null, trigAt: 2, trigFn: null };

const saved = { pos: new V3(), tar: new V3() };
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - x, 4);
function flyTo(getPos, getTar, dur, onDone, trigAt, trigFn) {
  cam.fromPos.copy(camera.position); cam.fromTar.copy(controls.target);
  cam.getPos = getPos; cam.getTar = getTar; cam.t = 0; cam.dur = reduceMotion ? dur * 0.4 : dur; cam.onDone = onDone; cam.trigAt = trigAt || 2; cam.trigFn = trigFn || null; cam.active = true;
  controls.enabled = false; controls.autoRotate = false; clearTimeout(autoTimer);
}
const _P = new V3(), _D = new V3(), _T = new V3(), _tmpA = new V3(), _tmpB = new V3();
function planetWorld(p, out) { return p.holder.getWorldPosition(out); }
function focusCamPos(p, out) {
  planetWorld(p, _P);
  _D.set(_P.x, 0, _P.z).normalize();
  _T.set(-_D.z, 0, _D.x); if (_T.dot(SUN) < 0) _T.negate();
  const dist = p.d.size * smallScale * 5.6, a = 0.9;
  out.copy(_P).addScaledVector(_D, Math.cos(a) * dist).addScaledVector(_T, Math.sin(a) * dist);
  out.y += dist * 0.28; return out;
}

let timeScale = 1, timeScaleTarget = 1, focusIdx = -1, hoverIdx = -1;

function returnToOverview() {
  if (mode === 'returning' || mode === 'overview' || mode === 'intro') return;
  mode = 'returning'; timeScaleTarget = 1; focusIdx = -1;
  flyTo(() => saved.pos, () => saved.tar, 2.2, () => {
    mode = 'overview'; controls.enabled = true; controls.update();
    controls.autoRotate = !reduceMotion; document.body.classList.remove('busy');
  });
}

/* ——— suratli sayyora ——— */
const viewer = $('#photo-viewer'), photoImg = $('#photo-large'), photoCap = $('#photo-cap');
let photoOpen = false;
function screenOf(obj) { const v = obj.getWorldPosition(new V3()).project(camera); return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight }; }
function focusPlanet(i) {
  const p = planets[i];
  saved.pos.copy(camera.position); saved.tar.copy(controls.target);
  mode = 'flying'; focusIdx = i; timeScaleTarget = 0.05; document.body.classList.add('busy');
  pendingReturn = false;
  flyTo(() => focusCamPos(p, _tmpA), () => planetWorld(p, _tmpB), 2.4, () => { mode = 'focused'; if (pendingReturn) { pendingReturn = false; returnToOverview(); } }, 0.72, () => openPhoto(i));
  const o = planetWorld(p, new V3());
  burst.fire(o, p.d.atmo, 5 * smallScale, 1.9, 3.4);
  shock.fire(o, p.d.atmo, 7.5 * smallScale, 1.3);
}
function openPhoto(i) {
  if (focusIdx !== i) return;
  const sp = screenOf(planets[i].holder);
  viewer.style.setProperty('--cx', sp.x + 'px'); viewer.style.setProperty('--cy', sp.y + 'px');
  viewer.style.setProperty('--dx', (sp.x - innerWidth / 2) + 'px'); viewer.style.setProperty('--dy', (sp.y - innerHeight / 2) + 'px');
  photoCap.textContent = 'Xotira · ' + (i + 1) + ' / ' + PL.length;
  photoImg.onerror = () => { photoCap.textContent = 'Surat topilmadi: assets/photo-' + (i + 1) + '.jpg'; };
  photoImg.src = 'assets/photo-' + (i + 1) + '.jpg';
  const show = () => { if (focusIdx === i) { viewer.classList.add('open'); document.body.classList.add('overlay'); photoOpen = true; } };
  (photoImg.decode ? photoImg.decode() : Promise.reject()).then(show, show);
}
function requestReturn() { if (mode === 'focused' || mode === 'greeting') returnToOverview(); else if (mode === 'flying') pendingReturn = true; }
function closePhoto() {
  if (!photoOpen) return;
  viewer.classList.remove('open'); document.body.classList.remove('overlay'); photoOpen = false;
  requestReturn();
}
$('#photo-close').addEventListener('click', closePhoto);
viewer.addEventListener('click', e => { if (e.target === viewer || e.target.classList.contains('pv-rays')) closePhoto(); });

/* ——— markaziy sayyora: tabrik ——— */
const reveal = $('#reveal');
const sparks = (() => {
  const c = $('#sparks'), ctx = c.getContext('2d'); let list = [], run = false, last = 0, nextAt = 0, w = 0, h = 0, dpr = 1;
  const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; };
  function spawn(x, y, n) {
    for (let i = 0; i < n && list.length < 420; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 5.2, cool = Math.random() < 0.22;
      list.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.3, life: 1, decay: 0.006 + Math.random() * 0.011, r: 0.8 + Math.random() * 2.2, hue: cool ? 195 : 36 + Math.random() * 18, star: Math.random() < 0.3 });
    }
  }
  function loop(now) {
    if (!run) return; requestAnimationFrame(loop);
    const dt = Math.min((now - last) / 16.7, 3); last = now;
    if (now > nextAt) { spawn(w * (0.15 + Math.random() * 0.7), h * (0.12 + Math.random() * 0.5), 46); nextAt = now + 850 + Math.random() * 700; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h); ctx.globalCompositeOperation = 'lighter';
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i]; p.vy += 0.045 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.life -= p.decay * dt;
      if (p.life <= 0) { list.splice(i, 1); continue; }
      const a = Math.max(p.life, 0), col = 'hsla(' + p.hue + ',90%,' + (62 + 25 * a) + '%,' + (a * 0.95) + ')';
      ctx.fillStyle = col;
      if (p.star) { const s = p.r * 2.6; ctx.beginPath(); ctx.moveTo(p.x, p.y - s); ctx.lineTo(p.x + s * 0.28, p.y - s * 0.28); ctx.lineTo(p.x + s, p.y); ctx.lineTo(p.x + s * 0.28, p.y + s * 0.28); ctx.lineTo(p.x, p.y + s); ctx.lineTo(p.x - s * 0.28, p.y + s * 0.28); ctx.lineTo(p.x - s, p.y); ctx.lineTo(p.x - s * 0.28, p.y - s * 0.28); ctx.closePath(); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); }
    }
  }
  return {
    start() { if (reduceMotion) return; size(); list = []; run = true; last = performance.now(); nextAt = last + 600; requestAnimationFrame(loop); },
    stop() { run = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); },
    resize: size
  };
})();
let greetOpen = false;
function openGreeting() {
  saved.pos.copy(camera.position); saved.tar.copy(controls.target);
  mode = 'flying'; timeScaleTarget = 0.15; document.body.classList.add('busy');
  const gd = portrait ? 17 : 13.5;
  pendingReturn = false;
  flyTo(() => _tmpA.copy(saved.pos).setLength(gd), () => ORIGIN, 2.2, () => { mode = 'greeting'; if (pendingReturn) { pendingReturn = false; returnToOverview(); } }, 0.66, showGreeting);
  burst.fire(ORIGIN, 0xffd79a, 15, 3.2, 5);
  shock.fire(ORIGIN, 0xffe3a8, 34, 1.8);
}
function showGreeting() { reveal.classList.add('show'); document.body.classList.add('overlay'); sparks.start(); greetOpen = true; }
function closeGreeting() {
  if (!greetOpen) return;
  greetOpen = false;
  reveal.classList.remove('show'); document.body.classList.remove('overlay'); sparks.stop();
  requestReturn();
}
$('#close').addEventListener('click', closeGreeting);
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (photoOpen) closePhoto(); else if (greetOpen) closeGreeting(); });

/* ——— sichqoncha / barmoq ——— */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(x, y) {
  const r = dom.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(pickables, false);
  return h.length ? h[0].object.userData : null;
}
let down = null; dom.style.cursor = 'grab';
dom.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
dom.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 9 || mode !== 'overview') return;
  const hit = pickAt(e.clientX, e.clientY); if (!hit) return;
  if (hit.kind === 'photo') focusPlanet(hit.index); else if (hit.kind === 'center') openGreeting();
});
dom.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || mode !== 'overview' || down) return;
  const hit = pickAt(e.clientX, e.clientY);
  hoverIdx = hit && hit.kind === 'photo' ? hit.index : -1;
  dom.style.cursor = hit ? 'pointer' : 'grab';
});

/* ════════════════════ O‘LCHAM O‘ZGARISHI ════════════════════ */
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  const now = innerWidth < innerHeight, changed = now !== portrait; portrait = now;
  baseDist = applyLayout(changed && mode === 'overview');
  sparks.resize();
});

/* ════════════════════ ADAPTIV SIFAT: sekin qurilmada avtomatik yengillashadi ════════════════════ */
const perf = { frames: 0, acc: 0, level: 0, startAt: 0 };
function degrade() {
  perf.level++;
  if (perf.level === 1) { Q.bloom = false; }
  else if (perf.level === 2) { Q.dpr = 1; renderer.setPixelRatio(1); composer.setPixelRatio(1); composer.setSize(innerWidth, innerHeight); U_PR.value = 1; }
  else if (perf.level === 3) { nearStars.visible = false; planets.forEach(p => { p.dust.visible = false; }); belt.visible = false; }
}

/* ════════════════════ ASOSIY SIKL ════════════════════ */
const clock = new THREE.Clock();
const dpx = () => renderer.getPixelRatio();
let T = 0, firstFrame = true;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05); T += dt; U_TIME.value = T;

  timeScale += (timeScaleTarget - timeScale) * Math.min(1, dt * 2.4);
  const odt = dt * timeScale;

  central.rotation.y += odt * 0.06;
  mainRing.rotation.z += odt * 0.01;
  belt.rotation.y -= odt * 0.02;
  farStars.rotation.y += dt * 0.0016; nearStars.rotation.y -= dt * 0.004;

  planets.forEach((p, i) => {
    p.theta += p.speed * odt;
    p.pivot.rotation.y = p.theta; p.holder.rotation.y = -p.theta;
    p.mesh.rotation.y += odt * p.spin;
    p.orbit.material.uniforms.uTheta.value = p.theta;
    p.dust.rotation.y += odt * 0.03 * (i % 2 ? 1 : -1);
    const target = (i === hoverIdx ? 0.5 : 0) + (i === focusIdx ? 1 : 0);
    p.glow += (target - p.glow) * Math.min(1, dt * 4);
    const u = p.mat.uniforms; u.uGlow.value = p.glow * 0.12; u.uFill.value = p.glow * 0.35;
    p.shellMat.uniforms.uIntensity.value = 1 + p.glow * 1.1;
    p.halo.visible = p.glow > 0.02; p.halo.material.opacity = Math.min(p.glow, 1) * 0.3;
    if (p.ringMesh) p.holder.getWorldPosition(p.ringMesh.material.uniforms.uCenter.value);
  });

  // orbita chizig‘ining ekrandagi qalinligini doim ~2 piksel qilib ushlaymiz
  const dist = camera.position.distanceTo(controls.target);
  ORBIT_CORE.value = THREE.MathUtils.clamp((2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) / (innerHeight * dpx()) * 1.7, 0.012, 0.35);

  // kamera
  if (mode === 'intro') {
    introT += dt; const f = Math.min(introT / INTRO_DUR, 1), e = easeOut(f);
    const rad = THREE.MathUtils.lerp(baseDist * 1.9, baseDist, e), az = THREE.MathUtils.lerp(1.5, 0, e), el = THREE.MathUtils.lerp(0.9, camElev(), e);
    camera.position.set(Math.sin(az) * Math.cos(el) * rad, Math.sin(el) * rad, Math.cos(az) * Math.cos(el) * rad);
    controls.target.copy(ORIGIN); camera.lookAt(ORIGIN);
    if (f >= 1) { mode = 'overview'; controls.enabled = true; controls.update(); }
    else controls.enabled = false;
  } else if (cam.active) {
    cam.t = Math.min(1, cam.t + dt / cam.dur); const e = easeIO(cam.t);
    camera.position.lerpVectors(cam.fromPos, cam.getPos(), e);
    controls.target.lerpVectors(cam.fromTar, cam.getTar(), e);
    camera.lookAt(controls.target);
    if (cam.trigFn && cam.t >= cam.trigAt) { const fn = cam.trigFn; cam.trigFn = null; fn(); }
    if (cam.t >= 1) { cam.active = false; if (cam.onDone) cam.onDone(); }
  } else if (mode === 'focused' && focusIdx >= 0) {
    const p = planets[focusIdx];
    focusCamPos(p, camera.position); camera.position.x += Math.sin(T * 0.45) * 0.12; camera.position.y += Math.cos(T * 0.37) * 0.08;
    planetWorld(p, controls.target); camera.lookAt(controls.target);
  } else if (mode === 'greeting') {
    camera.position.applyAxisAngle(Y_AXIS, dt * 0.05); camera.lookAt(ORIGIN);
  } else if (mode === 'overview') {
    controls.update();
  }

  burst.update(dt); shock.update(dt);

  if (Q.bloom) composer.render(dt); else renderer.render(scene, camera);

  if (firstFrame) { firstFrame = false; $('#loader').classList.add('done'); }

  // FPS kuzatuvi (intro tugagach, har ~2 soniyada)
  if (mode !== 'intro' && perf.level < 3) {
    perf.frames++; perf.acc += dt;
    if (perf.acc > 2.2) { const fps = perf.frames / perf.acc; if (fps < 38) degrade(); perf.frames = 0; perf.acc = 0; }
  }
}
frame();
}
